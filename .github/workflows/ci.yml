name: Offline fixture checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies (preparation only)
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Checks with outbound network disabled
        run: |
          sudo --preserve-env=PATH unshare --net bash -c 'make check'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-test-results
          path: results/tests.xml
