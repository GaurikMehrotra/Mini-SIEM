[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "minisiem"
version = "0.1.0"
description = "A defensive, local, evidence-bearing Mini-SIEM"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "pydantic==2.14.1",
  "typer==0.27.3",
  "rich==15.0.0",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "psutil==7.2.2",
  "matplotlib==3.11.2",
  "pysigma==1.5.1",
  "pysigma-backend-sqlite==2.0.0",
  "pysigma-pipeline-sysmon==2.0.0",
  "pysigma-pipeline-windows==2.0.1",
  "google-re2==1.1.20251105",
  "communityid==1.5.0",
  "jq==1.12.0",
]
[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.169.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20260906",
]
[project.scripts]
minisiem = "minisiem.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
[tool.setuptools.package-data]
minisiem = ["web/templates/*.html", "web/static/*.js", "web/static/*.css", "py.typed"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
files = ["src/minisiem", "lab", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
